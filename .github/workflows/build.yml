name: Build geosite
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "data/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout geosite builder
        uses: actions/checkout@v6
        with:
          repository: v2fly/domain-list-community
          path: community
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: community/go.mod
          cache: true
          cache-dependency-path: community/go.sum

      - name: Set tag
        if: github.ref_name == 'master'
        run: |
          DAILY_TAG=$(date +%Y%m%d%H%M)
          echo "DAILY_TAG=$DAILY_TAG" >> $GITHUB_ENV

      - name: Create Tag
        if: github.ref_name == 'master'
        uses: actions/github-script@v8
        with:
          script: |
            const { DAILY_TAG } = process.env
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${DAILY_TAG}`,
              sha: context.sha
            })

      - name: Build geosite.dat
        run: |
          set -euo pipefail

          rm -rf /tmp/out /tmp/data-min /tmp/needed
          mkdir -p /tmp/out /tmp/data-min

          needed=/tmp/needed
          touch "$needed"

          echo "category-ru" >> "$needed"

          resolve() {
            local file="$1"

            [ -f "community/data/$file" ] || return 0

            while IFS= read -r dep; do
              [ -n "$dep" ] || continue

              if ! grep -Fxq "$dep" "$needed"; then
                echo "$dep" >> "$needed"
                resolve "$dep"
              fi

            done < <(
              grep '^include:' "community/data/$file" 2>/dev/null \
                | sed 's/^include://' \
                | sed 's/[[:space:]]*#.*$//' \
                | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                | awk '{print $1}'
            )
          }

          resolve "category-ru"

          # Копируем зависимости category-ru из upstream
          while IFS= read -r f; do
            if [ -f "community/data/$f" ]; then
              cp "community/data/$f" "/tmp/data-min/$f"
            fi
          done < "$needed"

          # Добавляем локальный category-ru
          if [ -f data/category-ru ]; then
            cat data/category-ru >> /tmp/data-min/category-ru
          fi

          # Убираем дубликаты, но include оставляем как есть
          awk '
            /^include:/ {print; next}
            !seen[$0]++
          ' /tmp/data-min/category-ru > /tmp/data-min/category-ru.tmp

          mv /tmp/data-min/category-ru.tmp /tmp/data-min/category-ru

          # Заменяем upstream data минимальным набором
          rm -rf community/data
          mv /tmp/data-min community/data

          # Загружаем внешние списки как отдельные geosite-категории
          curl -fsSL --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/geoblock/full.lst \
            -o community/data/geoblock
          curl -fsSL --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/service/direct-with-ech.lst \
            -o community/data/ech-direct
          curl -fsSL --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/service/prefer-direct.lst \
            -o community/data/prefer-direct
          test -s community/data/geoblock
          test -s community/data/ech-direct
          test -s community/data/prefer-direct

          # Копируем локальные списки БЕЗ лишнего data/data/
          find ./data -maxdepth 1 -type f \
            ! -name "category-ru" \
            ! -name "category-geoblock-ru" \
            -print0 |
            while IFS= read -r -d '' f; do
              cp -a "$f" community/data/
            done

          # Объединяем локальные правила с внешней категорией geoblock
          test -f data/category-geoblock-ru
          cat data/category-geoblock-ru >> community/data/geoblock

          # Добавляем внешний список в категорию whitelist
          curl -fsSL --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/whitelist/domains.lst \
            -o /tmp/whitelist-domains.lst
          test -s /tmp/whitelist-domains.lst
          cat /tmp/whitelist-domains.lst >> community/data/whitelist

          echo "=== Files used for build ==="
          find community/data -maxdepth 1 -type f -printf '%f\n' | sort

          pushd community >/dev/null
          go run ./ -outputdir=/tmp/out
          popd >/dev/null

          test -s /tmp/out/dlc.dat
          cp -f /tmp/out/dlc.dat ./geosite.dat

      - name: Move files to publish directory
        if: github.ref_name == 'master'
        run: |
          set -euo pipefail
          rm -rf release
          rm -rf /tmp/release
          mkdir release
          cp ./geosite.dat release/
          sha256sum release/geosite.dat > release/geosite.dat.sha256
          cp -r release /tmp/release

      - name: Git push assets to "release" branch
        if: github.ref_name == 'master'
        run: |
          cd release || exit 1
          git init
          git config --local user.name "spanchy"
          git config --local user.email "spanchy@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Release ${{ env.DAILY_TAG }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release
          cd .. || exit 1
          git config --local user.name "spanchy"
          git config --local user.email "spanchy@users.noreply.github.com"
          git checkout master
          rm -rf release
          cp -r /tmp/release ./release
          git add release/
          git commit -m "Release ${{ env.DAILY_TAG }}" || echo "No changes to commit"
          git push origin master

      - name: Purge jsdelivr CDN
        if: github.ref_name == 'master'
        run: |
          set -euo pipefail
          cd release || exit 1
          find . -type f -print0 | while IFS= read -r -d '' f; do
            rel="${f#./}"
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${rel}"
          done

      - name: Publish release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.DAILY_TAG }}
          name: ${{ env.DAILY_TAG }}
          prerelease: false
          draft: false
          files: |
            release/geosite.dat
            release/geosite.dat.sha256
